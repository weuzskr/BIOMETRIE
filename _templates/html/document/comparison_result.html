<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="d-flex vh-100 justify-content-center align-items-center">
  <div class="card shadow-sm text-center" style="max-width: 400px;">
    <div class="card-body">
      <h2 class="card-title mb-4">Résultat de la comparaison</h2>
      <p class="display-4 fw-bold">{{ similarity }}%</p>

      {% if similarity >= 80 %}
        <span class="badge bg-success fs-5">
          ✅ Visages très similaires
        </span>
      {% elif similarity >= 60 %}
        <span class="badge bg-warning text-dark fs-5">
          ⚠️ Similarité moyenne, vérifier manuellement
        </span>
      {% else %}
        <span class="badge bg-danger fs-7">
          ❌ Les visages ne correspondent pas bien
        </span>
      {% endif %}
    </div>
  </div>
</div>
